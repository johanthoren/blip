<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0"/><stop offset=".5" stop-color="#5fd7ff" stop-opacity=".9"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="920" height="560" rx="18" fill="url(#bg)"/>

  <!-- the bar -->
  <rect x="0" y="0" width="920" height="34" rx="18" fill="#0d1526"/>
  <rect x="0" y="17" width="920" height="17" fill="#0d1526"/>
  <g fill="#7d8aa3" font-size="12">
    <text x="22" y="22">1</text><text x="44" y="22" fill="#e6edf7">2</text><text x="66" y="22">3</text><text x="88" y="22">4</text>
    <text x="440" y="22" fill="#e6edf7">Sun 30 Aug  9:41 PM</text>
    <text x="722" y="22">wifi</text><text x="760" y="22">bt</text><text x="784" y="22">vol</text><text x="826" y="22">34%</text>
  </g>
  <!-- blip chip in the bar -->
  <g transform="translate(872 8)">
    <rect x="-46" y="0" width="70" height="18" rx="9" fill="#0a84ff" fill-opacity=".18" stroke="#0a84ff" stroke-opacity=".6"/>
    <path d="M-38 3 h14 a3 3 0 0 1 3 3 v5 a3 3 0 0 1 -3 3 h-7 l-4 3 v-3 h-3 a3 3 0 0 1 -3 -3 v-5 a3 3 0 0 1 3 -3 z" fill="#5fd7ff"/>
    <text x="-16" y="13" font-size="12" font-weight="700" fill="#5fd7ff">3</text>
  </g>
  <rect x="0" y="34" width="920" height="2" fill="url(#glow)"/>

  <!-- panel -->
  <g transform="translate(300 52)" filter="url(#shadow)">
    <rect width="600" height="486" rx="16" fill="#0f1a2c" stroke="#5fd7ff" stroke-opacity=".35"/>
    <text x="28" y="40" font-size="18" font-weight="700" fill="#e6edf7">Jordan Blake, Casey Morgan</text>
    <text x="28" y="60" font-size="11" fill="#7d8aa3" letter-spacing="1.5">GROUP</text>
    <rect x="470" y="22" width="104" height="24" rx="12" fill="none" stroke="#7d8aa3" stroke-opacity=".5"/>
    <text x="486" y="38" font-size="11" fill="#9aa7bd">Esc = back</text>
    <line x1="28" y1="76" x2="572" y2="76" stroke="#ffffff" stroke-opacity=".08"/>

    <!-- day divider -->
    <text x="300" y="100" font-size="11" font-weight="700" fill="#7d8aa3" text-anchor="middle">Today</text>

    <!-- theirs, with sender name -->
    <text x="40" y="126" font-size="11" fill="#7d8aa3">Jordan Blake</text>
    <rect x="28" y="134" width="318" height="34" rx="17" fill="#ffffff" fill-opacity=".14"/>
    <rect x="28" y="152" width="16" height="16" fill="#ffffff" fill-opacity=".14"/>
    <text x="44" y="156" font-size="13" fill="#e6edf7">You guys up for a zoom session?</text>
    <text x="34" y="184" font-size="11" fill="#7d8aa3">5:17 PM</text>

    <!-- mine -->
    <rect x="392" y="196" width="180" height="34" rx="17" fill="#0a84ff"/>
    <rect x="556" y="214" width="16" height="16" fill="#0a84ff"/>
    <text x="408" y="218" font-size="13" fill="#ffffff">Works. I'll be there</text>
    <text x="566" y="246" font-size="11" fill="#7d8aa3" text-anchor="end">5:18 PM</text>

    <!-- theirs, second sender, a run of two -->
    <text x="40" y="272" font-size="11" fill="#7d8aa3">Casey Morgan</text>
    <rect x="28" y="280" width="122" height="34" rx="17" fill="#ffffff" fill-opacity=".14"/>
    <text x="44" y="302" font-size="13" fill="#e6edf7">For you? Yes</text>
    <rect x="28" y="320" width="262" height="34" rx="17" fill="#ffffff" fill-opacity=".14"/>
    <rect x="28" y="338" width="16" height="16" fill="#ffffff" fill-opacity=".14"/>
    <text x="44" y="342" font-size="13" fill="#e6edf7">Email heading your way now</text>
    <text x="34" y="370" font-size="11" fill="#7d8aa3">5:19 PM</text>

    <!-- mine, unsent yet: composing -->
    <line x1="28" y1="392" x2="572" y2="392" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="28" y="410" width="490" height="40" rx="20" fill="#ffffff" fill-opacity=".07" stroke="#0a84ff" stroke-opacity=".7"/>
    <text x="46" y="435" font-size="13" fill="#e6edf7">Have a great week gents!<tspan fill="#5fd7ff">▏</tspan></text>
    <circle cx="548" cy="430" r="16" fill="#0a84ff"/>
    <text x="548" y="436" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">↑</text>
  </g>

  <!-- left column: thread list peek -->
  <g transform="translate(24 60)">
    <text x="0" y="14" font-size="11" fill="#7d8aa3" letter-spacing="1.5">MESSAGES</text>
    <g transform="translate(0 30)">
      <circle cx="8" cy="18" r="4" fill="#0a84ff"/>
      <circle cx="36" cy="18" r="15" fill="#ffffff" fill-opacity=".18"/><text x="36" y="22" font-size="10" font-weight="700" fill="#e6edf7" text-anchor="middle">AR</text>
      <text x="60" y="15" font-size="13" font-weight="700" fill="#e6edf7">Alex Rivera</text>
      <text x="60" y="31" font-size="11" fill="#9aa7bd">See you at 7?</text>
    </g>
    <g transform="translate(0 78)">
      <circle cx="8" cy="18" r="4" fill="#0a84ff"/>
      <circle cx="36" cy="18" r="15" fill="#ffffff" fill-opacity=".18"/><text x="36" y="22" font-size="10" font-weight="700" fill="#e6edf7" text-anchor="middle">JB</text>
      <text x="60" y="15" font-size="13" font-weight="700" fill="#e6edf7">Jordan Blake, Casey…</text>
      <text x="60" y="31" font-size="11" fill="#9aa7bd">Email heading your way</text>
    </g>
    <g transform="translate(0 126)">
      <circle cx="36" cy="18" r="15" fill="#ffffff" fill-opacity=".18"/><text x="36" y="22" font-size="10" font-weight="700" fill="#e6edf7" text-anchor="middle">SL</text>
      <text x="60" y="15" font-size="13" fill="#9aa7bd">Sam Lee</text>
      <text x="60" y="31" font-size="11" fill="#9aa7bd">You: on my way</text>
    </g>
    <g transform="translate(0 174)">
      <circle cx="36" cy="18" r="15" fill="#ffffff" fill-opacity=".18"/><text x="36" y="22" font-size="10" font-weight="700" fill="#e6edf7" text-anchor="middle">#</text>
      <text x="60" y="15" font-size="13" fill="#9aa7bd">Team</text>
      <text x="60" y="31" font-size="11" fill="#9aa7bd">Nice, looking forward…</text>
    </g>
  </g>

  <!-- tagline -->
  <text x="24" y="330" font-size="30" font-weight="800" fill="#e6edf7">iMessage.</text>
  <text x="24" y="366" font-size="30" font-weight="800" fill="#5fd7ff">On Linux.</text>
  <text x="24" y="398" font-size="13" fill="#9aa7bd">Real bubbles. Real groups.</text>
  <text x="24" y="416" font-size="13" fill="#9aa7bd">Your Mac does the talking.</text>
  <text x="24" y="446" font-size="11" fill="#7d8aa3">Omarchy · QuickShell · bun</text>
  <text x="24" y="462" font-size="11" fill="#7d8aa3">one ssh socket · 47 ms</text>
</svg>
